---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  push:
    branches: [main]
    paths:
      - .renovaterc.json5
  schedule:
    - cron: 20 6 * * *
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log level
        type: choice
        default: info
        options:
          - debug
          - info
        required: true
      version:
        description: Renovate version
        default: latest
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      # A PR opened with the workflow's own GITHUB_TOKEN does not start a workflow run, so the
      # branch protection on main would never see a check. An app installation token does.
      - name: Generate token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Renovate clones the repository itself, so there is nothing to check out here.
      - name: Run Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          RENOVATE_PLATFORM: github
          # Commit over the API, so what Renovate pushes is a verified commit.
          RENOVATE_PLATFORM_COMMIT: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ inputs.version || 'latest' }}
