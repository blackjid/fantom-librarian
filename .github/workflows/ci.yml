name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The desktop crate links against the system webview. macOS is the release target, but the
      # workspace has to keep compiling here or the shared library layer drifts unnoticed.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs the committed fixtures in fixtures/ and every unit test. The private corpus
      # (fixtures-local/) is never available here and its tests skip by design — see
      # fixtures/README.md. Tests reaching for a committed fixture fail rather than skip,
      # so this job cannot pass by testing nothing.
      - name: Test
        run: cargo test --workspace

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm build` is tsc then vite, so this covers types and the production bundle in one step.
      - name: Typecheck and build
        run: pnpm build
