name: CI

# Pull requests, and main once the merge lands. Pushes to a branch are left to that branch's PR,
# which would otherwise build the same commit twice.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the run already in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Channel and components come from rust-toolchain.toml. Caching is part of this action.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The desktop crate links against the system webview, and fantom-midi against ALSA. macOS is
      # the release target, but the workspace has to keep compiling here or the shared library
      # layer drifts unnoticed.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libasound2-dev libdbus-1-dev

      - name: Format
        run: cargo fmt --all --check

      # `--locked` fails the run rather than resolving a dependency the lockfile does not name.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Runs the committed fixtures in fixtures/ and every unit test. The private corpus
      # (fixtures-local/) is never available here and its tests skip by design — see
      # fixtures/README.md. Tests reaching for a committed fixture fail rather than skip,
      # so this job cannot pass by testing nothing.
      - name: Test
        run: cargo test --workspace --locked

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # The pnpm version is the `packageManager` field of the manifest this points at.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm build` is tsc then vite, so this covers types and the production bundle in one step.
      - name: Typecheck and build
        run: pnpm build
