name: Release

# A tag is the only thing that publishes. The personal installation is upgraded by hand from the
# DMG this attaches, so a run that produces no artifact is a failed release, not a quiet one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The same file a developer shell reads, so the release toolchain is the one that was tested.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - uses: Swatinem/rust-cache@v2

      - name: Install
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # Ad-hoc signed (`signingIdentity: "-"`): enough for a Mac to run it after one Gatekeeper
      # confirmation, and it needs no Apple Developer account. Notarization comes with a Developer
      # ID certificate, which this project does not have yet.
      # The script the README documents, so the release path and a local build stay the same thing.
      - name: Build
        working-directory: desktop
        run: pnpm app:build

      - name: Collect the disk image
        id: dmg
        run: |
          # Searched from the workspace target dir rather than assumed: a missing bundle folder
          # should read as "no disk image was built", not as a find that could not open a path.
          dmg=$(find target -path '*/release/bundle/dmg/*.dmg' -print -quit)
          test -n "$dmg" || { echo "no .dmg was produced"; exit 1; }
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
          body: |
            A macOS build of the FANTOM Librarian, signed ad-hoc rather than with an Apple
            Developer ID. macOS will refuse it on first open: open **System Settings → Privacy &
            Security** and choose **Open Anyway**. Every later launch opens normally.

            Upgrading replaces the app only. Your library folder is untouched, and the first open
            after a format change copies the whole folder beside itself before it changes anything.
