[workspace]
resolver = "2"
members = ["crates/fantom-core", "crates/fantom-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/blackjid/fantom-librarian"

[workspace.dependencies]
binrw = "0.14"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
insta = "1"
fantom-core = { path = "crates/fantom-core" }
