[workspace]
resolver = "2"
members = [
    "crates/fantom-core",
    "crates/fantom-cli",
    "crates/fantom-library",
    "crates/fantom-midi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/blackjid/fantom-librarian"

[workspace.dependencies]
binrw = "0.14"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
insta = "1"
fantom-core = { path = "crates/fantom-core" }
fantom-library = { path = "crates/fantom-library" }
midir = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
